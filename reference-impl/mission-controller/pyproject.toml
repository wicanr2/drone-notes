[project]
name = "mission-controller"
version = "0.1.0"
description = "三層任務控制的最小參考實作:雲端任務服務 + 機載任務執行器"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
mavsdk = ["mavsdk>=2.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
