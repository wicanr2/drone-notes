[project]
name = "policy-lab"
version = "0.1.0"
description = "最小的飛行策略訓練骨架:訓練與驗收環境分離、輸出限幅、OOD 降級、指標驗收"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
