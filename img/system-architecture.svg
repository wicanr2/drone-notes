<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740"
     font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="1000" height="740" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">
    整套系統長這樣,每一塊對應哪一章
  </text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#666">
    越上面越能容忍延遲與斷線,越下面越不允許失效
  </text>

  <!-- ===== L5 雲端 ===== -->
  <rect x="150" y="76" width="600" height="72" rx="9" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="168" y="100" font-size="14.5" font-weight="700" fill="#4A148C">雲端</text>
  <text x="168" y="124" font-size="12.5" fill="#4A148C">任務資料模型 · 排程派工 · 多機協調 · 稽核與合規 · 成果資料</text>
  <text x="168" y="142" font-size="11.5" fill="#8E24AA">不進即時迴路,也不能假設鏈路常在</text>
  <rect x="676" y="86" width="30" height="20" rx="5" fill="#7B1FA2"/><text x="691" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">40</text>
  <rect x="712" y="86" width="30" height="20" rx="5" fill="#7B1FA2"/><text x="727" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">50</text>
  <text x="770" y="106" font-size="12" fill="#2E7D32">鏈路斷了</text>
  <text x="770" y="124" font-size="12" font-weight="700" fill="#2E7D32">任務照跑</text>

  <line x1="450" y1="148" x2="450" y2="178" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="462" y="168" font-size="11.5" fill="#555">HTTPS / MQTT</text>

  <!-- ===== L4 地面站 ===== -->
  <rect x="150" y="180" width="600" height="66" rx="9" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
  <text x="168" y="204" font-size="14.5" font-weight="700" fill="#311B92">地面站</text>
  <text x="168" y="228" font-size="12.5" fill="#311B92">遙測顯示 · 任務規劃 · 參數與韌體 · 現場監控</text>
  <rect x="712" y="190" width="30" height="20" rx="5" fill="#5E35B1"/><text x="727" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">50</text>
  <text x="770" y="212" font-size="12" fill="#2E7D32">關掉也不影響飛行</text>

  <line x1="450" y1="246" x2="450" y2="276" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ===== L3 鏈路 ===== -->
  <rect x="150" y="278" width="600" height="80" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="168" y="302" font-size="14.5" font-weight="700" fill="#E65100">通訊鏈路</text>
  <rect x="168" y="312" width="130" height="34" rx="6" fill="#FFE0B2" stroke="#EF6C00"/>
  <text x="233" y="327" text-anchor="middle" font-size="12" fill="#E65100">遙測 MAVLink</text>
  <text x="233" y="341" text-anchor="middle" font-size="11" fill="#BF360C">約 3 kB/s</text>
  <rect x="306" y="312" width="120" height="34" rx="6" fill="#FFE0B2" stroke="#EF6C00"/>
  <text x="366" y="327" text-anchor="middle" font-size="12" fill="#E65100">影像 RTP</text>
  <text x="366" y="341" text-anchor="middle" font-size="11" fill="#BF360C">數百 kB/s</text>
  <rect x="434" y="312" width="106" height="34" rx="6" fill="#FFE0B2" stroke="#EF6C00"/>
  <text x="487" y="333" text-anchor="middle" font-size="12" fill="#E65100">遙控 RC</text>
  <rect x="548" y="312" width="106" height="34" rx="6" fill="#FFE0B2" stroke="#EF6C00"/>
  <text x="601" y="333" text-anchor="middle" font-size="12" fill="#E65100">4G / 5G</text>
  <rect x="712" y="288" width="30" height="20" rx="5" fill="#EF6C00"/><text x="727" y="303" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">20</text>
  <text x="770" y="318" font-size="12" fill="#C62828">影像與遙測</text>
  <text x="770" y="336" font-size="12" font-weight="700" fill="#C62828">必須走不同通道</text>

  <line x1="330" y1="358" x2="330" y2="388" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="570" y1="358" x2="570" y2="388" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ===== 機上 ===== -->
  <rect x="140" y="378" width="620" height="182" rx="10" fill="#FAFAFA" stroke="#9E9E9E" stroke-dasharray="6 4"/>
  <text x="152" y="398" font-size="12.5" font-weight="700" fill="#616161">機上</text>

  <!-- L2 伴隨電腦 -->
  <rect x="168" y="406" width="270" height="80" rx="9" fill="#E1F5FE" stroke="#0277BD" stroke-width="1.5"/>
  <text x="184" y="428" font-size="14" font-weight="700" fill="#01579B">伴隨電腦(Linux)</text>
  <text x="184" y="449" font-size="12" fill="#01579B">視覺 · 任務執行器 · 影像編碼</text>
  <text x="184" y="467" font-size="12" fill="#01579B">酬載控制 · 與雲端通訊</text>
  <rect x="398" y="414" width="30" height="20" rx="5" fill="#0277BD"/><text x="413" y="429" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">30</text>

  <!-- L1 飛控 -->
  <rect x="462" y="406" width="270" height="80" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="478" y="428" font-size="14" font-weight="700" fill="#1B5E20">飛控(硬即時)</text>
  <text x="478" y="449" font-size="12" fill="#1B5E20">狀態估計 · 串級控制 · 控制分配</text>
  <text x="478" y="467" font-size="12" fill="#1B5E20">模式管理 · failsafe · 航點執行</text>
  <rect x="692" y="414" width="30" height="20" rx="5" fill="#2E7D32"/><text x="707" y="429" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">10</text>

  <line x1="438" y1="434" x2="458" y2="434" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="458" y1="462" x2="438" y2="462" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="448" y="504" text-anchor="middle" font-size="11.5" fill="#555">uXRCE-DDS</text>
  <text x="448" y="520" text-anchor="middle" font-size="11.5" fill="#555">或 MAVLink</text>

  <text x="770" y="428" font-size="12" fill="#C62828">掛了 → 飛控接手</text>
  <text x="770" y="452" font-size="12" font-weight="700" fill="#B71C1C">飛控失效</text>
  <text x="770" y="470" font-size="12" font-weight="700" fill="#B71C1C">沒有軟體解</text>

  <!-- L0 硬體 -->
  <rect x="168" y="524" width="564" height="28" rx="7" fill="#ECEFF1" stroke="#455A64"/>
  <text x="184" y="543" font-size="12.5" font-weight="700" fill="#263238">感測器 · 馬達與電調 · 電池 · 雲台與酬載</text>
  <rect x="692" y="527" width="30" height="20" rx="5" fill="#455A64"/><text x="707" y="542" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">15</text>

  <!-- 右側延遲刻度 -->
  <line x1="900" y1="86" x2="900" y2="552" stroke="#B0BEC5" stroke-width="2"/>
  <text x="912" y="100" font-size="11.5" fill="#78909C">分鐘~天</text>
  <text x="912" y="212" font-size="11.5" fill="#78909C">秒</text>
  <text x="912" y="322" font-size="11.5" fill="#78909C">數十 ms</text>
  <text x="912" y="440" font-size="11.5" fill="#78909C">ms</text>
  <text x="912" y="470" font-size="11.5" font-weight="700" fill="#C62828">0.9 ms</text>
  <text x="912" y="546" font-size="11.5" fill="#78909C">物理世界</text>
  <text x="982" y="320" font-size="11.5" fill="#90A4AE" transform="rotate(-90 982 320)" text-anchor="middle">時間尺度</text>

  <!-- 底部 -->
  <rect x="140" y="586" width="720" height="118" rx="9" fill="#FFF8E1" stroke="#F9A825"/>
  <text x="160" y="610" font-size="13.5" font-weight="700" fill="#8D6E00">一個功能該放哪一層,依序問三個問題</text>
  <text x="160" y="634" font-size="12.5" fill="#8D6E00">1. 會進即時迴路嗎?延遲預算不夠就不能往上放  →  第 00 章算給你看</text>
  <text x="160" y="656" font-size="12.5" fill="#8D6E00">2. 它失效時有安全退路嗎?沒有的話必須放在最不容易失效的那一層</text>
  <text x="160" y="678" font-size="12.5" fill="#8D6E00">3. 它要用的資料在哪一層才拿得到?資料搬不動,運算就得搬過去</text>
  <rect x="806" y="596" width="30" height="20" rx="5" fill="#F9A825"/><text x="821" y="611" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">00</text>
</svg>
