<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"
     font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#333"/>
    </marker>
    <marker id="ahz" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#C62828"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">
    兩套座標慣例:飛出反方向最常見的來源
  </text>

  <!-- 兩個大區塊背景 -->
  <rect x="40" y="60" width="420" height="420" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <rect x="540" y="60" width="420" height="420" rx="10" fill="#E1F5FE" stroke="#0277BD" stroke-width="1.5"/>

  <text x="250" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#1B5E20">PX4 內部</text>
  <text x="750" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#01579B">ROS 2 慣例</text>

  <!-- ===== 世界座標 ===== -->
  <text x="250" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#33691E">世界座標:NED</text>
  <text x="750" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#0277BD">世界座標:ENU</text>

  <!-- NED -->
  <g>
    <line x1="250" y1="215" x2="310" y2="170" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <text x="322" y="166" font-size="13" fill="#333">北 N(x)</text>
    <line x1="250" y1="215" x2="345" y2="238" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <text x="356" y="243" font-size="13" fill="#333">東 E(y)</text>
    <line x1="250" y1="215" x2="250" y2="292" stroke="#C62828" stroke-width="2.5" marker-end="url(#ahz)"/>
    <text x="250" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#C62828">下 D(z)</text>
    <circle cx="250" cy="215" r="4" fill="#333"/>
    <text x="130" y="215" font-size="12.5" fill="#555">z 向下為正</text>
  </g>

  <!-- ENU -->
  <g>
    <line x1="750" y1="215" x2="845" y2="238" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <text x="856" y="243" font-size="13" fill="#333">東 E(x)</text>
    <line x1="750" y1="215" x2="810" y2="170" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <text x="822" y="166" font-size="13" fill="#333">北 N(y)</text>
    <line x1="750" y1="215" x2="750" y2="160" stroke="#C62828" stroke-width="2.5" marker-end="url(#ahz)"/>
    <text x="766" y="158" font-size="13" font-weight="700" fill="#C62828">上 U(z)</text>
    <circle cx="750" cy="215" r="4" fill="#333"/>
    <text x="630" y="215" font-size="12.5" fill="#555">z 向上為正</text>
  </g>

  <!-- ===== 機體座標 ===== -->
  <text x="250" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#33691E">機體座標:FRD</text>
  <text x="750" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#0277BD">機體座標:FLU</text>

  <!-- FRD -->
  <g>
    <line x1="250" y1="405" x2="310" y2="378" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <text x="322" y="376" font-size="13" fill="#333">前 F(x)</text>
    <line x1="250" y1="405" x2="330" y2="428" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <text x="341" y="433" font-size="13" fill="#333">右 R(y)</text>
    <line x1="250" y1="405" x2="250" y2="458" stroke="#C62828" stroke-width="2.5" marker-end="url(#ahz)"/>
    <text x="250" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#C62828">下 D(z)</text>
    <circle cx="250" cy="405" r="4" fill="#333"/>
  </g>

  <!-- FLU -->
  <g>
    <line x1="750" y1="405" x2="810" y2="378" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <text x="822" y="376" font-size="13" fill="#333">前 F(x)</text>
    <line x1="750" y1="405" x2="670" y2="382" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <text x="658" y="378" text-anchor="end" font-size="13" fill="#333">左 L(y)</text>
    <line x1="750" y1="405" x2="750" y2="352" stroke="#C62828" stroke-width="2.5" marker-end="url(#ahz)"/>
    <text x="766" y="362" font-size="13" font-weight="700" fill="#C62828">上 U(z)</text>
    <circle cx="750" cy="405" r="4" fill="#333"/>
  </g>

  <!-- 中間轉換 -->
  <g>
    <line x1="466" y1="250" x2="534" y2="250" stroke="#7B1FA2" stroke-width="2.5" marker-end="url(#ah)"/>
    <line x1="534" y1="290" x2="466" y2="290" stroke="#7B1FA2" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="500" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#4A148C">轉換</text>
  </g>

  <!-- 公式 -->
  <rect x="40" y="496" width="600" height="118" rx="10" fill="#F3E5F5" stroke="#7B1FA2"/>
  <text x="60" y="522" font-size="14" font-weight="700" fill="#4A148C">轉換不是單純翻 z 軸</text>
  <g font-family="ui-monospace,'DejaVu Sans Mono',monospace" font-size="14.5" fill="#4A148C">
    <text x="60" y="550">NED → ENU :  (x, y, z)_ENU = ( y_NED ,  x_NED , −z_NED )</text>
    <text x="60" y="574">FRD → FLU :  (x, y, z)_FLU = ( x_FRD , −y_FRD , −z_FRD )</text>
    <text x="60" y="598">偏航角     :  yaw_ENU = π/2 − yaw_NED</text>
  </g>

  <rect x="660" y="496" width="300" height="118" rx="10" fill="#FFEBEE" stroke="#C62828"/>
  <text x="810" y="522" text-anchor="middle" font-size="14" font-weight="700" fill="#B71C1C">最隱蔽的一條</text>
  <text x="676" y="546" font-size="12.5" fill="#B71C1C">uXRCE-DDS 拿到的主題</text>
  <text x="676" y="565" font-size="12.5" font-weight="700" fill="#B71C1C">維持 PX4 慣例,不轉換</text>
  <text x="676" y="588" font-size="12.5" fill="#B71C1C">MAVROS 則會轉成 ENU / FLU</text>
  <text x="676" y="606" font-size="12.5" fill="#B71C1C">同專案混用兩者必出事</text>
</svg>
