<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800"
     font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">
    一台工作用多旋翼拆開來
  </text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#666">
    由上而下疊起來就是實機。每一層標的數字是文件裡對應的章
  </text>

  <!-- ============ 第 1 層:天線 ============ -->
  <path d="M170,110 L300,72 L430,110 L300,148 Z" fill="#FFE0B2" stroke="#EF6C00" stroke-width="1.5"/>
  <path d="M170,110 L300,148 L430,110 L430,120 L300,158 L170,120 Z" fill="#FFCC80" stroke="#EF6C00" stroke-width="1.2"/>
  <line x1="252" y1="92" x2="252" y2="80" stroke="#5D4037" stroke-width="2.5"/>
  <circle cx="252" cy="77" r="4" fill="#5D4037"/>
  <line x1="348" y1="92" x2="348" y2="82" stroke="#5D4037" stroke-width="2.5"/>
  <rect x="336" y="74" width="24" height="8" rx="2" fill="#5D4037"/>
  <line x1="440" y1="110" x2="550" y2="110" stroke="#BDBDBD" stroke-width="1"/>
  <text x="560" y="106" font-size="14" font-weight="700" fill="#E65100">天線層</text>
  <rect x="646" y="93" width="30" height="19" rx="5" fill="#EF6C00"/><text x="661" y="107" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">20</text>
  <text x="560" y="127" font-size="12.5" fill="#555">GNSS 天線 · 遙測電台 · 圖傳 · 遙控接收機</text>

  <!-- ============ 第 2 層:伴隨電腦 ============ -->
  <path d="M170,208 L300,170 L430,208 L300,246 Z" fill="#E1F5FE" stroke="#0277BD" stroke-width="1.5"/>
  <path d="M170,208 L300,246 L430,208 L430,220 L300,258 L170,220 Z" fill="#B3E5FC" stroke="#0277BD" stroke-width="1.2"/>
  <rect x="252" y="192" width="52" height="26" rx="3" fill="#0277BD" opacity="0.55"/>
  <line x1="440" y1="208" x2="550" y2="208" stroke="#BDBDBD" stroke-width="1"/>
  <text x="560" y="204" font-size="14" font-weight="700" fill="#01579B">伴隨電腦</text>
  <rect x="646" y="191" width="30" height="19" rx="5" fill="#0277BD"/><text x="661" y="205" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">30</text>
  <text x="560" y="225" font-size="12.5" fill="#555">Jetson / Pi 類的 Linux 機器</text>
  <text x="560" y="243" font-size="12.5" fill="#555">視覺 · 任務執行器 · 影像編碼 · 連雲端</text>

  <!-- ============ 第 3 層:飛控 ============ -->
  <path d="M170,306 L300,268 L430,306 L300,344 Z" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <path d="M170,306 L300,344 L430,306 L430,318 L300,356 L170,318 Z" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.2"/>
  <rect x="276" y="292" width="30" height="22" rx="3" fill="#2E7D32" opacity="0.6"/>
  <circle cx="330" cy="308" r="5" fill="#1B5E20"/>
  <circle cx="252" cy="312" r="5" fill="#1B5E20"/>
  <line x1="440" y1="306" x2="550" y2="306" stroke="#BDBDBD" stroke-width="1"/>
  <text x="560" y="302" font-size="14" font-weight="700" fill="#1B5E20">飛控板</text>
  <rect x="646" y="289" width="30" height="19" rx="5" fill="#2E7D32"/><text x="661" y="303" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">10</text>
  <text x="560" y="323" font-size="12.5" fill="#555">MCU · IMU ×2~3 · 氣壓計 · 磁力計</text>
  <text x="560" y="341" font-size="12.5" font-weight="700" fill="#C62828">整套系統唯一不允許失效的東西</text>

  <!-- ============ 第 4 層:動力(含機臂) ============ -->
  <line x1="300" y1="404" x2="170" y2="404" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="300" y1="404" x2="430" y2="404" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="300" y1="404" x2="300" y2="366" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <line x1="300" y1="404" x2="300" y2="442" stroke="#455A64" stroke-width="7" stroke-linecap="round"/>
  <g fill="none" stroke="#78909C" stroke-width="2">
    <ellipse cx="170" cy="404" rx="30" ry="9"/>
    <ellipse cx="430" cy="404" rx="30" ry="9"/>
    <ellipse cx="300" cy="366" rx="30" ry="9"/>
    <ellipse cx="300" cy="442" rx="30" ry="9"/>
  </g>
  <g fill="#37474F">
    <circle cx="170" cy="404" r="7"/><circle cx="430" cy="404" r="7"/>
    <circle cx="300" cy="366" r="7"/><circle cx="300" cy="442" r="7"/>
  </g>
  <path d="M234,404 L300,385 L366,404 L300,423 Z" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
  <line x1="470" y1="404" x2="550" y2="404" stroke="#BDBDBD" stroke-width="1"/>
  <text x="560" y="400" font-size="14" font-weight="700" fill="#263238">動力層</text>
  <rect x="646" y="387" width="30" height="19" rx="5" fill="#455A64"/><text x="661" y="401" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">15</text>
  <text x="560" y="421" font-size="12.5" fill="#555">機臂 · 馬達 ×4 · 電調 · 螺旋槳 · 電源分配</text>
  <text x="560" y="439" font-size="12.5" fill="#555">槳盤面積決定懸停功率:P ∝ 1/√A</text>

  <!-- ============ 第 5 層:電池 ============ -->
  <path d="M200,502 L300,472 L400,502 L300,532 Z" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <path d="M200,502 L300,532 L400,502 L400,524 L300,554 L200,524 Z" fill="#FFECB3" stroke="#F9A825" stroke-width="1.2"/>
  <line x1="410" y1="502" x2="550" y2="502" stroke="#BDBDBD" stroke-width="1"/>
  <text x="560" y="498" font-size="14" font-weight="700" fill="#8D6E00">電池</text>
  <rect x="646" y="485" width="30" height="19" rx="5" fill="#F9A825"/><text x="661" y="499" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">15</text>
  <text x="560" y="519" font-size="12.5" fill="#555">獨立管理的消耗品,會在機器之間流動</text>
  <text x="560" y="537" font-size="12.5" fill="#555">循環數與健康度要進資料模型</text>

  <!-- ============ 第 6 層:雲台與相機 ============ -->
  <path d="M230,600 L300,578 L370,600 L300,622 Z" fill="#E1F5FE" stroke="#0277BD" stroke-width="1.5"/>
  <circle cx="300" cy="636" r="17" fill="#B3E5FC" stroke="#0277BD" stroke-width="1.5"/>
  <circle cx="300" cy="636" r="7" fill="#01579B"/>
  <line x1="380" y1="600" x2="550" y2="600" stroke="#BDBDBD" stroke-width="1"/>
  <text x="560" y="596" font-size="14" font-weight="700" fill="#01579B">雲台與酬載</text>
  <rect x="646" y="579" width="30" height="19" rx="5" fill="#0277BD"/><text x="661" y="593" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">30</text>
  <text x="560" y="617" font-size="12.5" fill="#555">相機 · 紅外 · 測距;雲台負責指向與穩像</text>
  <text x="560" y="635" font-size="12.5" font-weight="700" fill="#C62828">影像不經過飛控,走自己的通道</text>

  <!-- ============ 底部三個提醒 ============ -->
  <rect x="60" y="676" width="290" height="98" rx="9" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="78" y="700" font-size="13" font-weight="700" fill="#1B5E20">機上有兩台電腦</text>
  <text x="78" y="722" font-size="12" fill="#2E7D32">飛控是硬即時的 MCU,伴隨電腦</text>
  <text x="78" y="740" font-size="12" fill="#2E7D32">是一般 Linux。它們職責不同、</text>
  <text x="78" y="758" font-size="12" fill="#2E7D32">失效後果也不同,不要混為一談</text>

  <rect x="365" y="676" width="290" height="98" rx="9" fill="#E1F5FE" stroke="#0277BD"/>
  <text x="383" y="700" font-size="13" font-weight="700" fill="#01579B">一台機是一組節點</text>
  <text x="383" y="722" font-size="12" fill="#0277BD">飛控、雲台、相機、伴隨電腦在</text>
  <text x="383" y="740" font-size="12" fill="#0277BD">MAVLink 眼中各有自己的編號。</text>
  <text x="383" y="758" font-size="12" fill="#0277BD">指令送錯元件是常見的卡關原因</text>

  <rect x="670" y="676" width="290" height="98" rx="9" fill="#FFEBEE" stroke="#C62828"/>
  <text x="688" y="700" font-size="13" font-weight="700" fill="#B71C1C">越下面越不能失效</text>
  <text x="688" y="722" font-size="12" fill="#C62828">雲端斷了任務照跑,伴隨電腦掛</text>
  <text x="688" y="740" font-size="12" fill="#C62828">了飛控接手,但 IMU 失效沒有</text>
  <text x="688" y="758" font-size="12" fill="#C62828">軟體解 —— 只能靠硬體冗餘</text>
</svg>
